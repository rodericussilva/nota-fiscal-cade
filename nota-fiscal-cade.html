<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nota Fiscal: Cadê?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3EEE2;
    --paper-edge: #E4DCC8;
    --ink: #22281F;
    --ink-soft: #5A5F52;
    --rust: #B6452F;
    --forest: #2F6F4E;
    --sky-top: #FFD79A;
    --sky-bottom: #FF9F68;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Karla', sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    min-height: 100%;
    padding: 28px 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .stage { width: 100%; max-width: 460px; }
  .daytrack { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .daytrack .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(34,40,31,0.18); }
  .receipt {
    position: relative;
    background: var(--paper);
    border-radius: 2px;
    padding: 26px 24px 22px;
    box-shadow: 0 18px 40px rgba(20,20,10,0.28);
  }
  .intro-art { font-size: 34px; margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .narrative { font-size: 14.5px; line-height: 1.55; margin-bottom: 10px; }
  button.next {
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 13px;
    border-radius: 6px;
    border: none;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }
  .footer-note {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    color: rgba(34,40,31,0.55);
    margin-top: 14px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="daytrack" id="daytrack" style="visibility:hidden;"></div>
  <div class="receipt" id="receipt"></div>
  <div class="footer-note">protótipo — EducaJogo Fiscal · Fortaleza/CE</div>
</div>

<script>
const receipt = document.getElementById('receipt');

function renderIntro() {
  receipt.innerHTML = `
    <div class="intro-art">🧾</div>
    <h1>Nota Fiscal: Cadê?</h1>
    <p class="narrative">Uma jornada de escolhas e cidadania fiscal — um dia comum em Fortaleza.</p>
    <p class="narrative">Da padaria de manhã ao caminho de volta pra casa à noite, cada parada traz uma decisão de consumo.</p>
    <button class="next" id="startBtn">COMEÇAR O DIA →</button>
  `;
  document.getElementById('startBtn').onclick = () => {
    receipt.innerHTML = '<p class="narrative">(cenas em desenvolvimento...)</p>';
  };
}

renderIntro();
</script>
</body>
</html>
