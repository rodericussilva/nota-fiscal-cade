<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nota Fiscal: Cadê?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3EEE2; --paper-edge: #E4DCC8; --ink: #22281F; --ink-soft: #5A5F52;
    --rust: #B6452F; --forest: #2F6F4E; --sky-top: #FFD79A; --sky-bottom: #FF9F68;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Karla', sans-serif; color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    transition: background 1.1s ease; min-height: 100%; padding: 28px 16px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .stage { width: 100%; max-width: 460px; }
  .daytrack { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .daytrack .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(34,40,31,0.18); }
  .daytrack .dot.active { background: var(--ink); transform: scale(1.25); }
  .daytrack .dot.done { background: rgba(34,40,31,0.55); }
  .receipt { position: relative; background: var(--paper); border-radius: 2px; padding: 26px 24px 22px; box-shadow: 0 18px 40px rgba(20,20,10,0.28); }
  .meters { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 12.5px; border-bottom: 1px dashed var(--paper-edge); padding-bottom: 12px; margin-bottom: 16px; }
  .meter .label { color: var(--ink-soft); }
  .meter .value { font-weight: 700; font-size: 15px; display: block; margin-top: 2px; }
  .meter.right { text-align: right; }
  .place { font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 6px; }
  .time { font-weight: 700; font-size: 11px; color: var(--rust); }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .narrative { font-size: 14.5px; line-height: 1.55; margin-bottom: 10px; }
  .dialogue { font-size: 14px; font-style: italic; color: var(--ink-soft); border-left: 2px solid var(--paper-edge); padding-left: 12px; margin-bottom: 20px; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice { font-size: 14px; font-weight: 700; text-align: left; padding: 12px 14px; border-radius: 6px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  button.choice:hover { background: var(--ink); color: var(--paper); }
  .nota-box { font-family: 'Space Mono', monospace; font-size: 12px; background: #fff; border: 1px dashed var(--paper-edge); border-radius: 4px; padding: 14px; margin-bottom: 14px; }
  .nota-box.informal { background: rgba(182,69,47,0.06); border-color: rgba(182,69,47,0.35); }
  .nota-item { display:flex; justify-content: space-between; padding: 3px 0; }
  .nota-rule { border-top: 1px dashed var(--paper-edge); margin: 8px 0; }
  .nota-total { display:flex; justify-content: space-between; font-weight:700; font-size: 13px; }
  .nota-tax { display:flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); padding-top: 2px; }
  .feedback { font-size: 14px; line-height: 1.55; background: rgba(34,40,31,0.05); border-radius: 6px; padding: 13px 14px; margin-bottom: 16px; }
  .delta { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; margin-bottom: 8px; display: inline-block; }
  .delta.pos { color: var(--forest); } .delta.neg { color: var(--rust); }
  button.next { width: 100%; font-family: 'Space Mono', monospace; font-size: 13px; padding: 13px; border-radius: 6px; border: none; background: var(--ink); color: var(--paper); cursor: pointer; }
  .end-art { font-size: 34px; margin-bottom: 10px; }
  .end-verdict { font-weight: 700; font-size: 15.5px; margin-bottom: 8px; }
  .consolidada { font-family: 'Space Mono', monospace; font-size: 11.5px; background: #fff; border: 1px dashed var(--paper-edge); border-radius: 4px; padding: 14px; margin: 14px 0; }
  .consolidada .linha { display:flex; justify-content:space-between; padding: 3px 0; }
  .consolidada .linha.fora { color: rgba(34,40,31,0.4); text-decoration: line-through; }
  .consolidada .scene-label { font-size: 9.5px; text-transform: uppercase; color: var(--ink-soft); margin: 8px 0 2px; }
  .consolidada .grand-total { display:flex; justify-content:space-between; font-size: 14px; font-weight:700; border-top: 1px dashed var(--paper-edge); margin-top:10px; padding-top: 8px; color: var(--forest); }
  .footer-note { text-align: center; font-family: 'Space Mono', monospace; font-size: 10.5px; color: rgba(34,40,31,0.55); margin-top: 14px; }
</style>
</head>
<body>
<div class="stage">
  <div class="daytrack" id="daytrack"></div>
  <div class="receipt" id="receipt"></div>
  <div class="footer-note">protótipo — EducaJogo Fiscal · Fortaleza/CE</div>
</div>

<script>
function brl(v) { return v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function round2(v) { return Math.round(v * 100) / 100; }

// v3: itens detalhados por cena + alíquota por tipo de operação (ICMS produto / ISS serviço)
const SCENES = [
  { time: "08h12", place: "Padaria do bairro", sky: ["#FFD79A", "#FF9F68"], taxLabel: "ICMS", taxRate: 0.20,
    narrative: "Você passa na padaria para comprar pão e leite. O atendente baixa a voz.",
    dialogue: "“Não precisa de nota, né? Fica mais em conta pra você.”",
    choices: [
      { label: "Pedir a nota fiscal mesmo assim", tag: "com nota", formal: true,
        items: [ {nome: "Pão francês (1kg)", valor: 12.00}, {nome: "Leite integral (1L)", valor: 6.00} ],
        feedback: "Essa venda de R$ 18,00 entra oficialmente no sistema." },
      { label: "Aceitar o desconto e não pedir", tag: "sem nota", formal: false,
        items: [ {nome: "Pão francês (1kg)", valor: 10.00}, {nome: "Leite integral (1L)", valor: 5.00} ],
        feedback: "Você paga menos agora, mas gera R$ 0,00 em imposto registrado." }
    ]
  },
  { time: "12h30", place: "Restaurante self-service", sky: ["#8FC7E8", "#C9E3EE"], taxLabel: "ICMS", taxRate: 0.20,
    narrative: "No almoço, o dono do restaurante oferece pular o caixa oficial.",
    dialogue: "“Pode me mandar no PIX pessoal, fica mais rápido.”",
    choices: [
      { label: "Pedir para pagar no caixa, com nota", tag: "com nota", formal: true,
        items: [ {nome: "Prato por quilo (0,450kg)", valor: 33.00}, {nome: "Suco natural", valor: 8.00} ],
        feedback: "O valor pago é o mesmo, mas vira faturamento real do estabelecimento." },
      { label: "Pagar no PIX pessoal do dono", tag: "sem nota", formal: false,
        items: [ {nome: "Prato por quilo (0,450kg)", valor: 33.00}, {nome: "Suco natural", valor: 8.00} ],
        feedback: "Esse valor nunca entra no faturamento oficial do restaurante." }
    ]
  },
  { time: "15h00", place: "Oficina de celular", sky: ["#A7D8E8", "#E8F2EE"], taxLabel: "ISS", taxRate: 0.05,
    narrative: "Seu celular quebrou. Conserto informal por R$ 80 ou assistência registrada por R$ 110.",
    dialogue: "“Faço sem nota por menos. Com nota, sai mais caro.”",
    choices: [
      { label: "Pagar na assistência registrada", tag: "com nota", formal: true,
        items: [ {nome: "Troca de tela (serviço técnico)", valor: 110.00} ],
        feedback: "Gera ISS sobre o serviço — e sai com nota fiscal, garantia de verdade." },
      { label: "Fazer o conserto informal", tag: "sem nota", formal: false,
        items: [ {nome: "Troca de tela (sem nota)", valor: 80.00} ],
        feedback: "Mais barato, mas nenhum ISS registrado nem documento de garantia." }
    ]
  },
  { time: "17h10", place: "Loja de tênis no shopping", sky: ["#F4A261", "#E76F51"], taxLabel: "ICMS", taxRate: 0.20,
    narrative: "Você vai comprar um tênis novo. A vendedora oferece um desconto sem nota.",
    dialogue: "“Sem nota no seu nome, consigo um desconto.”",
    choices: [
      { label: "Recusar e levar a nota", tag: "com nota", formal: true,
        items: [ {nome: "Tênis esportivo", valor: 260.00}, {nome: "Par de meias esportivas", valor: 20.00} ],
        feedback: "A compra gera imposto registrado e garante a nota fiscal." },
      { label: "Aceitar o desconto sem nota", tag: "sem nota", formal: false,
        items: [ {nome: "Tênis esportivo (sem nota)", valor: 234.00}, {nome: "Par de meias (sem nota)", valor: 18.00} ],
        feedback: "A loja registra menos vendas do que realmente teve." }
    ]
  },
  { time: "18h50", place: "Camelô perto do terminal", sky: ["#6D5A82", "#3E3A5E"], taxLabel: "ICMS", taxRate: 0.20,
    narrative: "Um boné 'original' por um décimo do preço de loja.",
    dialogue: "“É original, só não tenho nota.”",
    choices: [
      { label: "Não comprar e seguir pra loja oficial", tag: "sem compra hoje", formal: null, items: [],
        feedback: "Nenhum imposto é gerado hoje — mas nenhum prejuízo também." },
      { label: "Comprar sem nota", tag: "sem nota", formal: false,
        items: [ {nome: "Boné (vendedor ambulante, sem nota)", valor: 25.00} ],
        feedback: "Nenhuma etapa dessa cadeia passou pelo sistema fiscal." }
    ]
  }
];

const DELTAS_CONSC = [[10,-6],[7,-7],[9,-4],[8,-8],[9,-9]];
let sceneIndex = 0, lastChoice = null, totalImposto = 0, totalGasto = 0, consciencia = 50, historico = [];
const receipt = document.getElementById('receipt');
const daytrack = document.getElementById('daytrack');
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function setSky(sky) { document.body.style.background = `linear-gradient(180deg, ${sky[0]} 0%, ${sky[1]} 100%)`; }
function renderDots() {
  daytrack.innerHTML = '';
  for (let i = 0; i < SCENES.length; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === sceneIndex ? ' active' : (i < sceneIndex ? ' done' : ''));
    daytrack.appendChild(d);
  }
}
function metersHTML() {
  return `<div class="meters">
    <div class="meter"><span class="label">imposto gerado hoje</span><span class="value">R$ ${brl(totalImposto)}</span></div>
    <div class="meter right"><span class="label">consciência fiscal</span><span class="value">${consciencia}%</span></div>
  </div>`;
}
function notaHTML(scene, choice) {
  const subtotal = round2(choice.items.reduce((s, it) => s + it.valor, 0));
  if (choice.items.length === 0) return `<div class="nota-box informal">NENHUMA COMPRA REALIZADA</div>`;
  if (!choice.formal) {
    return `<div class="nota-box informal">
      ${choice.items.map(it => `<div class="nota-item"><span>${it.nome}</span><span>R$ ${brl(it.valor)}</span></div>`).join('')}
      <div class="nota-rule"></div>
      <div class="nota-total"><span>TOTAL PAGO</span><span>R$ ${brl(subtotal)}</span></div>
      <div class="nota-tax"><span>Tributos registrados</span><span>R$ 0,00</span></div>
    </div>`;
  }
  const imposto = round2(subtotal * scene.taxRate);
  return `<div class="nota-box">
    ${choice.items.map(it => `<div class="nota-item"><span>${it.nome}</span><span>R$ ${brl(it.valor)}</span></div>`).join('')}
    <div class="nota-rule"></div>
    <div class="nota-total"><span>TOTAL A PAGAR</span><span>R$ ${brl(subtotal)}</span></div>
    <div class="nota-tax"><span>Valor aprox. tributos (${scene.taxLabel}, ${(scene.taxRate*100).toFixed(0)}%)</span><span>R$ ${brl(imposto)}</span></div>
  </div>`;
}
function renderIntro() {
  daytrack.style.visibility = 'hidden';
  receipt.innerHTML = `<h1>Nota Fiscal: Cadê?</h1><p class="narrative">Uma jornada de escolhas e cidadania fiscal.</p>
    <button class="next" id="startBtn">COMEÇAR O DIA →</button>`;
  document.getElementById('startBtn').onclick = () => { daytrack.style.visibility = 'visible'; sceneIndex = 0; setSky(SCENES[0].sky); renderDots(); renderScene(); };
}
function renderScene() {
  const s = SCENES[sceneIndex]; setSky(s.sky); renderDots();
  receipt.innerHTML = `${metersHTML()}<div class="place">${s.place}</div><div class="time">${s.time}</div>
    <h1 style="margin-top:8px;">${s.narrative}</h1><p class="dialogue">${s.dialogue}</p>
    <div class="choices">${s.choices.map((c, i) => `<button class="choice" data-i="${i}"><span>${c.tag}</span>${c.label}</button>`).join('')}</div>`;
  receipt.querySelectorAll('.choice').forEach(btn => btn.onclick = () => chooseOption(s, parseInt(btn.dataset.i)));
}
function chooseOption(scene, i) {
  const c = scene.choices[i];
  const subtotal = round2(c.items.reduce((s, it) => s + it.valor, 0));
  const imposto = c.formal ? round2(subtotal * scene.taxRate) : 0;
  totalImposto = round2(totalImposto + imposto); totalGasto = round2(totalGasto + subtotal);
  const [up, down] = DELTAS_CONSC[sceneIndex];
  consciencia = clamp(consciencia + (c.formal === false ? down : (c.formal === true ? up : Math.round(up*0.7))), 0, 100);
  historico.push({ place: scene.place, items: c.items, subtotal, imposto, formal: c.formal });
  lastChoice = c; renderFeedback(scene, c, imposto);
}
function renderFeedback(scene, c, imposto) {
  const isLast = sceneIndex === SCENES.length - 1;
  receipt.innerHTML = `${metersHTML()}${notaHTML(scene, c)}
    <span class="delta ${imposto > 0 ? 'pos' : 'neg'}">${imposto > 0 ? '+R$ ' + brl(imposto) + ' de imposto' : 'R$ 0,00 de imposto'}</span>
    <div class="feedback">${c.feedback}</div>
    <button class="next" id="nextBtn">${isLast ? 'VER A NOTA CONSOLIDADA →' : 'CONTINUAR O DIA →'}</button>`;
  document.getElementById('nextBtn').onclick = () => { isLast ? renderEnding() : (sceneIndex++, renderScene()); };
}
function renderEnding() {
  daytrack.style.visibility = 'hidden'; setSky(["#1B2A4A", "#0E1630"]);
  let verdict = consciencia >= 75 ? "Cidadão fiscal consciente" : consciencia >= 45 ? "Entre o bolso e a cidadania" : "Prioridade total pro bolso";
  const linhas = historico.map(h => {
    if (h.items.length === 0) return `<div class="scene-label">${h.place}</div><div class="linha"><span>— nenhuma compra —</span><span>R$ 0,00</span></div>`;
    const itemLines = h.items.map(it => `<div class="linha${h.formal ? '' : ' fora'}"><span>${it.nome}</span><span>R$ ${brl(it.valor)}</span></div>`).join('');
    const impLine = h.formal ? `<div class="linha"><span>↳ imposto recolhido</span><span>R$ ${brl(h.imposto)}</span></div>` : `<div class="linha fora"><span>↳ sem nota — R$ 0,00</span><span></span></div>`;
    return `<div class="scene-label">${h.place}</div>${itemLines}${impLine}`;
  }).join('');
  receipt.innerHTML = `<div class="end-art">🌙</div><h1>Fim do dia</h1>
    <p class="narrative">Em R$ ${brl(totalGasto)} gastos, suas escolhas geraram <strong>R$ ${brl(totalImposto)}</strong> em imposto.</p>
    <div class="end-verdict">${verdict}</div>
    <div class="consolidada">${linhas}<div class="grand-total"><span>TOTAL ARRECADADO</span><span>R$ ${brl(totalImposto)}</span></div></div>
    <button class="next" id="restartBtn">JOGAR DE NOVO</button>`;
  document.getElementById('restartBtn').onclick = () => { sceneIndex = 0; totalImposto = 0; totalGasto = 0; consciencia = 50; historico = []; renderIntro(); };
}
renderIntro();
</script>
</body>
</html>
